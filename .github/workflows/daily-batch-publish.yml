name: daily-batch-publish

# 承認済みキュー(draft=true & prerelease=true)の中から最も古い1件だけを
# publishする。publish自体がrelease:publishedイベントを発火するので、
# 実際のInstagram投稿は既存の publish.yml がそのまま担当する。
on:
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC = 09:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 承認済みキューから最古の1件を選ぶ
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[] | select(.draft==true and .prerelease==true)] | sort_by(.created_at) | .[0].tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "承認済みキューは空です。今日は何もしません。"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "投稿対象: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: publish(→ publish.ymlが検知してInstagram投稿)
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.pick.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false --prerelease=false
