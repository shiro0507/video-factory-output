name: daily-batch-publish

# 承認済みキュー(draft=true & prerelease=true)の中から、投稿先アカウント
# (Release本文metaの account。未指定は main)ごとに最も古い1件ずつをpublishする。publish自体がrelease:publishedイベントを発火するので、
# 実際のInstagram投稿は既存の publish.yml がそのまま担当する。
#
# 注意点(必ず維持すること):
# 1. 対象の特定は release id で行う(draft中のtag_nameはGitHubが割り当てる
#    仮名"untagged-xxxx"を返す仕様で信用できない)。
#    さらに、draft中の release を一度でもPATCHすると、tag_nameを明示しない限り
#    その仮名が本タグとして確定してしまうため、publish時のPATCHには
#    必ず本来の名前(release.name)をtag_nameとして明示的に含めること。
# 2. publish操作は secrets.RELEASE_PAT(fine-grained PAT)を使うこと。
#    デフォルトの github.token(GITHUB_TOKEN) で発生させたイベントは
#    無限ループ防止のため他のワークフローを再トリガーしない仕様があり、
#    github.token でpublishすると publish.yml(Instagram投稿)が起動しない。
on:
  schedule:
    # GitHubのscheduleはUTC固定かつ数時間遅れることがある(00:00 UTC指定で実際は~04:30 UTC起動が続いた)。
    # 遅延込みで午前中に投稿されるよう前倒しして 20:00 UTC = 05:00 JST 指定にしている。
    - cron: "0 20 * * *" # 毎日 20:00 UTC = 05:00 JST (実際の起動は遅れることがある)
  workflow_dispatch: {}

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 投稿先アカウント(Release本文metaの account。未指定は main)ごとに、
      # 承認済みキューの最古1件ずつをpublishする(=各アカウント1日1投稿)。
      - name: アカウントごとに承認済みキューの最古1件をpublish(→ publish.ymlがInstagram投稿)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          PICKED=$(gh api "repos/${{ github.repository }}/releases" --paginate --slurp | jq -r '
            [.[][] | select(.draft==true and .prerelease==true)
              | . + {account: ((.body // "" | capture("```json\n(?<j>[\\s\\S]*?)\n```").j | (try fromjson catch {}) | .account) // "main")}]
            | sort_by(.created_at) | group_by(.account) | map(.[0])
            | .[] | "\(.id)\t\(.name)\t\(.account)"')
          if [ -z "$PICKED" ]; then
            echo "承認済みキューは空です。今日は何もしません。"
            exit 0
          fi
          while IFS=$'\t' read -r ID NAME ACCOUNT; do
            echo "投稿対象 account=$ACCOUNT release id=$ID name=$NAME"
            gh api "repos/${{ github.repository }}/releases/$ID" \
              -X PATCH -F draft=false -F prerelease=false -f "tag_name=$NAME" > /dev/null
          done <<< "$PICKED"
