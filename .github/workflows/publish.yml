name: publish-instagram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "対象のリリースタグ(手動実行時)"
        required: true

# 同じ動画を二重投稿しないよう、タグ単位で直列化
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: リリース情報を解決
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          echo "対象タグ: $TAG"

          # .meta.json を取得
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.meta.json" --dir meta --clobber
          META=$(ls meta/*.meta.json | head -1)

          MEDIA_TYPE=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write((m.media_type || "REELS").toUpperCase());
          ' "$META")
          echo "media_type=$MEDIA_TYPE" >> "$GITHUB_OUTPUT"
          echo "メディアタイプ: $MEDIA_TYPE"

          if [ "$MEDIA_TYPE" = "CAROUSEL" ]; then
            # 画像アセットの公開ダウンロードURL(認証不要)をファイル名の昇順(=表示順)で取得
            IMAGE_URLS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[] | select(.name | test("\\.(jpe?g|png)$"; "i"))] | sort_by(.name) | map(.url) | join(",")')
            if [ -z "$IMAGE_URLS" ]; then
              echo "::error::画像アセットが見つかりません"
              exit 1
            fi
            echo "image_urls=$IMAGE_URLS" >> "$GITHUB_OUTPUT"
          else
            # mp4 アセットの公開ダウンロードURL(認証不要)を取得
            VIDEO_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[] | select(.name | endswith(".mp4")) | .url][0]')
            if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
              echo "::error::mp4 アセットが見つかりません"
              exit 1
            fi
            echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: キャプション組み立て
        id: cap
        run: |
          set -euo pipefail
          META=$(ls meta/*.meta.json | head -1)
          echo "メタファイル: $META"
          CAPTION=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const tags = (m.hashtags || [])
              .map((t) => (t.startsWith("#") ? t : "#" + t))
              .join(" ");
            process.stdout.write([m.caption || "", tags].filter(Boolean).join("\n\n"));
          ' "$META")
          {
            echo "caption<<__EOF__"
            echo "$CAPTION"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

          THUMB_OFFSET=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(m.thumb_offset != null ? String(m.thumb_offset) : "");
          ' "$META")
          echo "thumb_offset=$THUMB_OFFSET" >> "$GITHUB_OUTPUT"

      - name: Instagram へ投稿(Reels or カルーセル)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          MEDIA_TYPE: ${{ steps.rel.outputs.media_type }}
          VIDEO_URL: ${{ steps.rel.outputs.video_url }}
          IMAGE_URLS: ${{ steps.rel.outputs.image_urls }}
          THUMB_OFFSET: ${{ steps.cap.outputs.thumb_offset }}
          CAPTION: ${{ steps.cap.outputs.caption }}
        run: node scripts/publish-instagram.mjs
